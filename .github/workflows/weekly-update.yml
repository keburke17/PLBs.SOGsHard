name: Weekly Stats Update

on:
  # Re-enabled 2026-10-01 for Winter 2026-27 (paused 2026-08-10 between seasons).
  # When a season ends, comment this `schedule:` block out again: once GameSheet
  # retires the season page every source returns 0 rows and update.py's
  # all-sources-empty guard exits non-zero, turning this workflow red three times
  # a week for no real reason. Re-enable it together with the rollover constants
  # in update.py (GS_SEASON, GS_DIVISION, GS_TEAM, GS_SEASON_START, SEASON_FILE)
  # and the season file in the "Commit updated data" step below.
  schedule:
    # The division is "B2 - Wed/Thu" — it schedules games on BOTH nights, and the
    # late slot at Ice Centre runs to ~12:15am ET. Every run must therefore land
    # after the last puck drop of the night it covers, or GameSheet has nothing
    # posted yet. (Times are fixed UTC: 1h earlier in ET once DST ends in
    # November — 3am/5am ET, still well after the last game.)
    - cron: '0 8 * * 4'    # Thu 08:00 UTC = Thu 04:00 ET — Wednesday night results
    - cron: '0 10 * * 5'   # Fri 10:00 UTC = Fri 06:00 ET — Thursday night results
    - cron: '0 10 * * 6'   # Sat 10:00 UTC = Sat 06:00 ET — catch-up for scores
                           #   entered late, or for a Cloudflare-blocked run
  workflow_dispatch:       # manual trigger from the GitHub UI — still available

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run weekly update
        run: python3 update.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/winter_26_27.json data/app_data.json
          git diff --staged --quiet || git commit -m "chore: weekly stats update $(date -u +%Y-%m-%d)"
          git push
